version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: safeconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: safeconnect_db
      POSTGRES_USER: safeconnect_user
      POSTGRES_PASSWORD: change_this_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - safeconnect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeconnect_user -d safeconnect_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for rate limiting and sessions
  redis:
    image: redis:7-alpine
    container_name: safeconnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - safeconnect-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safeconnect-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      APP_PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: safeconnect_db
      DB_USER: safeconnect_user
      DB_PASSWORD: change_this_secure_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_very_long_random_secret_key_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_to_another_very_long_random_secret_key_min_32_chars}
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - safeconnect-network
    volumes:
      - ./backend/logs:/app/logs

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safeconnect-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - safeconnect-network

  # Nginx Reverse Proxy (optional, for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: safeconnect-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - safeconnect-network

networks:
  safeconnect-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
